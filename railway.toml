[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npx prisma generate && npm run build"

[deploy]
startCommand = "npx prisma migrate deploy && node dist/services/api/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "api"
startCommand = "npx prisma migrate deploy && node dist/services/api/index.js"

[[services]]
name = "worker"
startCommand = "node dist/services/worker/index.js"

[[services]]
name = "gateway"
startCommand = "node dist/services/gateway-simulator/index.js"
