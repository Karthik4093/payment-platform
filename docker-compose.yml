version: '3.9'

services:
  # ─── Infrastructure ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: payments_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payments_user
      POSTGRES_PASSWORD: payments_pass
      POSTGRES_DB: payments_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments_user -d payments_db']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: payments_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: payments_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: payments_user
      RABBITMQ_DEFAULT_PASS: payments_pass
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  # ─── Application Services ─────────────────────────────────────
  gateway-simulator:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: payments_gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3001
      GATEWAY_HOST: 0.0.0.0
      WEBHOOK_URL: http://api:3000/webhooks/payment
      WEBHOOK_SECRET: super-secret-webhook-signing-key-change-in-production
      LOG_LEVEL: info
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: payments_migrate
    command: ['sh', '-c', 'npx prisma migrate deploy && npx tsx prisma/seed.ts']
    environment:
      DATABASE_URL: postgresql://payments_user:payments_pass@postgres:5432/payments_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: payments_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://payments_user:payments_pass@postgres:5432/payments_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://payments_user:payments_pass@rabbitmq:5672
      API_PORT: 3000
      API_HOST: 0.0.0.0
      GATEWAY_URL: http://gateway-simulator:3001
      WEBHOOK_SECRET: super-secret-webhook-signing-key-change-in-production
      FRAUD_MAX_PAYMENTS_PER_MINUTE: '10'
      FRAUD_MAX_FAILURES_PER_5_MINUTES: '5'
      FRAUD_MAX_AMOUNT: '100000'
      RETRY_MAX_ATTEMPTS: '5'
      RETRY_BASE_DELAY_MS: '1000'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: payments_worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://payments_user:payments_pass@postgres:5432/payments_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://payments_user:payments_pass@rabbitmq:5672
      GATEWAY_URL: http://gateway-simulator:3001
      WEBHOOK_URL: http://api:3000/webhooks/payment
      WEBHOOK_SECRET: super-secret-webhook-signing-key-change-in-production
      WORKER_CONCURRENCY: '10'
      RETRY_MAX_ATTEMPTS: '5'
      RETRY_BASE_DELAY_MS: '1000'
      INVENTORY_SERVICE_URL: http://gateway-simulator:3001/inventory
      SHIPPING_SERVICE_URL: http://gateway-simulator:3001/shipping
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
